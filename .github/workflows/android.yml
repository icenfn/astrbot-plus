name: android

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-android:
    name: Build (Android)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Add Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Initialize Android project
        run: npm run tauri android init
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Allow cleartext HTTP (for self-hosted AstrBot over http)
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            echo "already patched"
          else
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
            echo "patched:"; grep -n "<application" "$MANIFEST"
          fi

      - name: Build Android APK (arm64)
        run: npm run tauri android build -- --apk --target aarch64
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-plus-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
