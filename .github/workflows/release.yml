name: Release

# 手动触发，或推送 v* 标签时触发。
# 从 CHANGELOG.md 提取最新版本号与发布说明，构建 Windows(nsis) 与 Android(arm64)，
# 汇总为一次 GitHub Release。
#
# Android 原生工程（src-tauri/gen/android）已作为源码提交进仓库：manifest、MainActivity、
# 图标、ABI、cleartext 等定制都直接写在模板里，构建时无需再 `android init` + 打补丁。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      body: ${{ steps.meta.outputs.body }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version + body from CHANGELOG.md
        id: meta
        run: |
          version=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^##[[:space:]]*//')
          body=$(awk -v v="$version" '$0 ~ "^## " v "$" {c=1; next} c && /^## / {exit} c' CHANGELOG.md)
          should=true
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            should=false
          fi
          {
            echo "version=$version"
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
            echo "should_release=$should"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build (Windows nsis)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer (nsis)
        run: npm run tauri build -- --bundles nsis
      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Rename-Item $exe.FullName "AstrbotPlus-${{ needs.prepare.outputs.version }}-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-android:
    name: Build (Android arm64)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"
      - name: Install dependencies
        run: npm ci
      - name: Build APK (arm64)
        run: npx tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
      - name: Sign + rename APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > /tmp/ks.jks
            alias="$ANDROID_KEY_ALIAS"; pass="$ANDROID_KEY_PASSWORD"
          else
            cp android/debug.keystore /tmp/ks.jks
            alias="astrbotplus"; pass="android"
          fi
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          APK=$(find src-tauri/gen/android -name "*-release.apk" | head -1)
          mkdir -p release
          "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/ks.jks \
            --ks-pass pass:"$pass" --ks-key-alias "$alias" --key-pass pass:"$pass" \
            /tmp/aligned.apk
          cp /tmp/aligned.apk "release/AstrbotPlus-${{ needs.prepare.outputs.version }}-arm64.apk"
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*.apk
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [prepare, build-windows, build-android]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.body }}
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
