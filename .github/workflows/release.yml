name: Release

# 手动触发，或推送 v* 标签时触发。
# 从 CHANGELOG.md 提取最新版本号与发布说明，构建
# Linux(deb/rpm) / Windows(nsis) / Android(arm64+armv7)，并汇总为一次 GitHub Release。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      body: ${{ steps.ver.outputs.body }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version + body from CHANGELOG.md
        id: ver
        run: python3 scripts/extract_changelog.py >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build (Linux deb/rpm)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Linux bundles (deb / rpm)
        run: npm run tauri build -- --bundles deb,rpm
      - name: Collect + rename artifacts
        run: bash scripts/collect_artifacts.sh linux "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release
          if-no-files-found: error

  build-windows:
    name: Build (Windows nsis)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Windows installer (nsis)
        run: npm run tauri build -- --bundles nsis
      - name: Collect + rename installer
        shell: bash
        run: bash scripts/collect_artifacts.sh windows "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release
          if-no-files-found: error

  build-android:
    name: Build (Android arm64/armv7)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + Android targets (arm64 + armv7)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK (preinstalled on runner)
        run: bash scripts/setup_android_sdk.sh

      - name: Android NDK r26b
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Initialize Android project
        run: npx tauri android init

      - name: Prepare signing keystore
        run: bash scripts/prepare_android_keystore.sh

      - name: Prepare Android project (icons / version / manifest / MainActivity / signing)
        run: |
          python3 scripts/android_prepare.py \
            --project src-tauri/gen/android \
            --version "${{ needs.prepare.outputs.version }}" \
            --icons src-tauri/icons/android \
            --keystore "$RUNNER_TEMP/release.keystore"

      - name: Build Android APK (split per ABI)
        run: npx tauri android build --apk --split-per-abi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Collect + rename APKs
        run: bash scripts/collect_artifacts.sh android "${{ needs.prepare.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [prepare, build-linux, build-windows, build-android]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body: ${{ needs.prepare.outputs.body }}
          files: |
            artifacts/linux-release/*
            artifacts/windows-release/*
            artifacts/android-release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
