<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="AstrBot+">
  <title>AstrBot+</title>
  <!-- AstrBot+ desktop/mobile app icon — a derivative ("二创") of the AstrBot
       favicon sparkle. The rounded-square tile is inset ~7% so the icon does
       NOT look enlarged/cropped, and it matches the Android adaptive safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45aae3"/>
      <stop offset="0.55" stop-color="#2f86bd"/>
      <stop offset="1" stop-color="#1a5c92"/>
    </linearGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4ff"/>
    </linearGradient>
  </defs>

  <rect x="76" y="76" width="872" height="872" rx="200" fill="url(#bg)"/>

  <g transform="translate(500 498) scale(1.30) translate(-256 -256)">
    <path d="M256 96 C266 176 336 246 416 256 C336 266 266 336 256 416 C246 336 176 266 96 256 C176 246 246 176 256 96 Z"
          fill="url(#mk)"/>
  </g>

  <path d="M804 752 V860 M750 806 H858" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
</svg>
