<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>AstrBot+ tile</title>
  <!-- Full-bleed rounded-square background tile (brand gradient), used to build
       the legacy Android launcher icons by compositing the mark on top. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45aae3"/>
      <stop offset="0.55" stop-color="#2f86bd"/>
      <stop offset="1" stop-color="#1a5c92"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
</svg>
